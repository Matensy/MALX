[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malx"
version = "0.1.0"
description = "MALX — Malware Analysis & Security Workbench. Evidence-first static analysis, reverse engineering assistance and correlation. Never executes samples."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "defusedxml>=0.7",
  "numpy>=1.26",
  "pefile>=2023.2.7",
  "pyelftools>=0.31",
  "olefile>=0.46",
  "ppdeep>=20200505",
  "packaging>=23",
  "cryptography>=42",
]

[project.optional-dependencies]
# Optional engines. MALX degrades gracefully (and reports the limitation) when they are missing.
yara = ["yara-python>=4.3"]
reverse = ["capstone>=5.0"]
archives = ["py7zr>=0.21", "pyzipper>=0.3.6"]
tlsh = ["py-tlsh>=4.7"]
full = [
  "yara-python>=4.3",
  "capstone>=5.0",
  "py7zr>=0.21",
  "pyzipper>=0.3.6",
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
malx = "backend.main:cli"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["reports/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
