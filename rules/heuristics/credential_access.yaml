rules:
  - id: HEUR-CRED-001
    name: Browser credential database access
    category: credential_access
    severity: high
    confidence: 0.7
    conditions:
      all:
        - string_tags_any: [browser_credentials]
        - any:
            - string_tags_any: [browser_profile_paths]
            - imports_any: [CryptUnprotectData, BCryptDecrypt, sqlite3_open, sqlite3_prepare_v2]
            - strings_any: ["sqlite", "encrypted_key", "os_crypt", "select origin_url", "password_value"]
    explanation: "The artifact references browser credential stores (Login Data, logins.json, key4.db) together with browser profile paths, DPAPI or SQLite access."
    legitimate: "Password managers and browser migration tools read these files."
    mitre: [T1555.003]

  - id: HEUR-CRED-002
    name: Browser cookie theft indicators
    category: credential_access
    severity: medium
    confidence: 0.55
    conditions:
      all:
        - strings_any: ["\\network\\cookies", "cookies.sqlite", "\\cookies", "host_key", "encrypted_value"]
        - string_tags_any: [browser_profile_paths, browser_credentials]
    explanation: "Browser cookie databases are referenced next to browser profile paths (session hijacking)."
    legitimate: "Privacy cleaners and browser tools access cookies."
    mitre: [T1539]

  - id: HEUR-CRED-003
    name: LSASS / credential dumping indicators
    category: credential_access
    severity: high
    confidence: 0.7
    conditions:
      any:
        - string_tags_any: [credential_tool_strings]
        - all:
            - string_tags_any: [lsass_reference]
            - imports_any: [MiniDumpWriteDump, OpenProcess, ReadProcessMemory, NtReadVirtualMemory]
            - imports_any: [AdjustTokenPrivileges, LookupPrivilegeValueA, LookupPrivilegeValueW]
    explanation: "LSASS is referenced together with process memory reading/dumping and privilege adjustment, or known dumping commands appear."
    legitimate: "Crash dump utilities and EDR products open LSASS."
    mitre: [T1003.001]

  - id: HEUR-CRED-004
    name: Windows Credential Manager / Vault access
    category: credential_access
    severity: medium
    confidence: 0.55
    applies_to: [pe]
    conditions:
      imports_any: [CredEnumerateA, CredEnumerateW, VaultEnumerateItems, VaultGetItem]
    explanation: "Enumerates stored Windows credentials."
    legitimate: "Credential management utilities and SSO agents."
    mitre: [T1555.004]

  - id: HEUR-CRED-005
    name: Cryptocurrency wallet targeting
    category: credential_access
    severity: high
    confidence: 0.65
    conditions:
      any:
        - string_tags_count: {any: [crypto_wallet_paths], min: 1}
        - strings_count: {any: ["wallet.dat", "electrum", "exodus", "atomic wallet", "metamask", "nkbihfbeogaeaoehlefnkodbefgpgknn", "coinomi", "jaxx", "guarda", "binance"], min: 3}
    explanation: "Wallet files/extension identifiers of several cryptocurrency wallets are referenced."
    legitimate: "Wallet software references its own data."
    mitre: [T1555]

  - id: HEUR-CRED-006
    name: Messenger / gaming token theft
    category: credential_access
    severity: medium
    confidence: 0.6
    conditions:
      string_tags_any: [messenger_tokens]
    explanation: "Discord/Telegram/Steam token storage locations are referenced."
    legitimate: "Clients reference their own storage; third-party access is rare."
    mitre: [T1552.001]

  - id: HEUR-CRED-007
    name: Unix credential file access
    category: credential_access
    severity: medium
    confidence: 0.55
    conditions:
      string_tags_any: [unix_credential_files]
    explanation: "/etc/shadow, SSH private keys or cloud CLI credential files are referenced."
    legitimate: "Backup and configuration tools read these files."
    mitre: [T1552.001, T1552.004]

  - id: HEUR-CRED-008
    name: Keylogging capability
    category: collection
    severity: medium
    confidence: 0.6
    applies_to: [pe]
    conditions:
      all:
        - any:
            - imports_any: [SetWindowsHookExA, SetWindowsHookExW]
            - imports_all: [GetAsyncKeyState, GetForegroundWindow]
        - imports_any: [GetForegroundWindow, GetWindowTextA, GetWindowTextW, GetKeyboardState, MapVirtualKeyA, MapVirtualKeyW, ToUnicode, ToAscii]
    explanation: "Keyboard hooks/polling combined with window-title collection."
    legitimate: "Hotkey utilities, games and accessibility software."
    mitre: [T1056.001]
