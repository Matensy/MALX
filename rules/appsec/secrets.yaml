# Secret patterns. Values are always masked before they reach the database,
# reports or logs (e.g. AKIA************).
rules:
  - {id: SECRET-AWS-001, kind: secret, title: "AWS access key ID", languages: [any], severity: high, cwe: CWE-798, category: cloud_credential,
     pattern: '\b(AKIA|ASIA|AGPA|AIDA|AROA|ANPA)[0-9A-Z]{16}\b', description: "AWS access key identifier.", recommendation: "Deactivate the key in IAM and rotate."}
  - {id: SECRET-AWS-002, kind: secret, title: "AWS secret access key", languages: [any], severity: critical, cwe: CWE-798, category: cloud_credential, ignore_case: true,
     pattern: 'aws(.{0,20})?(secret|private)?(.{0,20})?(access)?.?key["''\s]*[:=]\s*["'']?[A-Za-z0-9/+=]{40}\b', description: "AWS secret key.", recommendation: "Rotate immediately and audit CloudTrail."}
  - {id: SECRET-GH-001, kind: secret, title: "GitHub token", languages: [any], severity: high, cwe: CWE-798, category: token,
     pattern: '\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}\b|\bgithub_pat_[A-Za-z0-9_]{60,}\b', description: "GitHub personal/OAuth/app token.", recommendation: "Revoke in GitHub settings."}
  - {id: SECRET-GL-001, kind: secret, title: "GitLab token", languages: [any], severity: high, cwe: CWE-798, category: token,
     pattern: '\bglpat-[A-Za-z0-9_\-]{20}\b', description: "GitLab personal access token.", recommendation: "Revoke and rotate."}
  - {id: SECRET-SLACK-001, kind: secret, title: "Slack token / webhook", languages: [any], severity: high, cwe: CWE-798, category: token,
     pattern: '\bxox[baprs]-[A-Za-z0-9-]{10,}\b|hooks\.slack\.com/services/T[A-Za-z0-9]+/B[A-Za-z0-9]+/[A-Za-z0-9]+', description: "Slack credential.", recommendation: "Revoke the token/webhook."}
  - {id: SECRET-STRIPE-001, kind: secret, title: "Stripe live secret key", languages: [any], severity: critical, cwe: CWE-798, category: token,
     pattern: '\b(sk|rk)_live_[0-9a-zA-Z]{24,}\b', description: "Stripe live secret key.", recommendation: "Roll the key in the Stripe dashboard."}
  - {id: SECRET-GCP-001, kind: secret, title: "Google API key", languages: [any], severity: medium, cwe: CWE-798, category: cloud_credential,
     pattern: '\bAIza[0-9A-Za-z_\-]{35}\b', description: "Google API key.", recommendation: "Restrict or regenerate the key."}
  - {id: SECRET-GCP-002, kind: secret, title: "Google service account key", languages: [any], severity: critical, cwe: CWE-798, category: cloud_credential,
     pattern: '"type"\s*:\s*"service_account"', description: "Service-account JSON key file.", recommendation: "Delete the key in IAM and create a new one."}
  - {id: SECRET-PK-001, kind: secret, title: "Private key", languages: [any], severity: critical, cwe: CWE-321, category: private_key,
     pattern: '-----BEGIN ((RSA|DSA|EC|OPENSSH|ENCRYPTED|PGP) )?PRIVATE KEY( BLOCK)?-----', description: "Embedded private key material.", recommendation: "Revoke/replace the key pair."}
  - {id: SECRET-JWT-001, kind: secret, title: "JSON Web Token", languages: [any], severity: medium, cwe: CWE-798, category: token,
     pattern: '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b', description: "A JWT (may grant access until it expires).", recommendation: "Invalidate sessions signed with the same key if real."}
  - {id: SECRET-DBURL-001, kind: secret, title: "Database URL with credentials", languages: [any], severity: high, cwe: CWE-798, category: connection_string,
     pattern: '\b(postgres(ql)?|mysql|mariadb|mongodb(\+srv)?|redis|amqp|mssql|sqlserver)://[^:\s/"''@]{1,64}:[^@\s"'']{3,128}@[^\s"''/]+', exclude: '(user(name)?|password|pass|\$\{|<|example)[:@]', description: "Connection URL embedding a password.", recommendation: "Move credentials to secrets management and rotate."}
  - {id: SECRET-CONN-001, kind: secret, title: "Connection string with password", languages: [any], severity: high, cwe: CWE-798, category: connection_string, ignore_case: true,
     pattern: '(server|data source|host)=[^;"'']+;[^"''\n]*(password|pwd)=[^;"''\s]{3,}', exclude: '(password|pwd)=(\*+|\$\{|\{|<|your|changeme)', description: "ADO/ODBC-style connection string with password.", recommendation: "Use integrated auth or a vault."}
  - {id: SECRET-AZ-001, kind: secret, title: "Azure storage account key", languages: [any], severity: critical, cwe: CWE-798, category: cloud_credential,
     pattern: 'AccountKey=[A-Za-z0-9+/=]{80,90}', description: "Azure storage key.", recommendation: "Regenerate the storage key."}
  - {id: SECRET-TWILIO-001, kind: secret, title: "Twilio API key", languages: [any], severity: high, cwe: CWE-798, category: token,
     pattern: '\bSK[0-9a-fA-F]{32}\b', description: "Twilio API key SID.", recommendation: "Delete the key in Twilio."}
  - {id: SECRET-SENDGRID-001, kind: secret, title: "SendGrid API key", languages: [any], severity: high, cwe: CWE-798, category: token,
     pattern: '\bSG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43}\b', description: "SendGrid key.", recommendation: "Revoke in SendGrid."}
  - {id: SECRET-NPM-001, kind: secret, title: "npm access token", languages: [any], severity: high, cwe: CWE-798, category: token,
     pattern: '\bnpm_[A-Za-z0-9]{36}\b', description: "npm token (package publishing).", recommendation: "Revoke on npmjs.com."}
  - {id: SECRET-TG-001, kind: secret, title: "Telegram bot token", languages: [any], severity: high, cwe: CWE-798, category: token,
     pattern: '\b\d{8,10}:AA[A-Za-z0-9_-]{33}\b', description: "Telegram bot API token (frequently used as stealer exfiltration channel).", recommendation: "Revoke through @BotFather."}
  - {id: SECRET-DISCORD-001, kind: secret, title: "Discord webhook URL", languages: [any], severity: medium, cwe: CWE-798, category: token,
     pattern: 'https://(ptb\.|canary\.)?discord(app)?\.com/api/webhooks/\d{17,20}/[A-Za-z0-9_\-]{60,70}', description: "Discord webhook (post access to a channel).", recommendation: "Delete the webhook."}
  - {id: SECRET-LLM-001, kind: secret, title: "AI provider API key", languages: [any], severity: high, cwe: CWE-798, category: token,
     pattern: '\bsk-(ant-(api\d{2}-)?[A-Za-z0-9_\-]{40,}|proj-[A-Za-z0-9_\-]{40,}|[A-Za-z0-9]{48})\b', description: "API key for an AI service.", recommendation: "Revoke in the provider console."}
  - {id: SECRET-PWD-001, kind: secret, title: "Hardcoded password assignment", languages: [any], severity: medium, cwe: CWE-798, category: password, ignore_case: true,
     pattern: '\b(password|passwd|pwd|pass|secret|api_?key|access_?token|auth_?token)\b["'']?\s*[:=]\s*["''][^"''\s]{6,64}["'']',
     exclude: '(\$\{|\{\{|<[a-z_]+>|example|changeme|change_me|your[-_]|xxxx|\*\*\*\*|placeholder|dummy|sample|test(ing)?|password123|process\.env|os\.environ|getenv|""|'''')',
     description: "A literal password/secret assigned in code or configuration.", recommendation: "Load credentials from the environment or a vault and rotate this one."}
