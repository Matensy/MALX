# Network context lists used by the IOC engine and heuristics.
# These lists provide *context*. A domain on "suspicious_services" is not malicious
# by itself; a domain on "common" is not trustworthy by itself either.

common_domains:
  # Well-known references that appear in legitimate binaries/documents (schemas,
  # certificate infrastructure, vendor sites). IOCs on these are flagged "common".
  - microsoft.com
  - windows.com
  - windowsupdate.com
  - msftncsi.com
  - live.com
  - office.com
  - office365.com
  - msn.com
  - bing.com
